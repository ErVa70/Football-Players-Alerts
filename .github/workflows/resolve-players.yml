name: Resolve Players

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve players
        run: python resolve_players.py

      - name: Save resolved players
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add players_resolved.json

          if git diff --cached --quiet; then
            echo "No changes to players_resolved.json"
          else
            git commit -m "Update resolved player data"
            git push
          fi
