name: Check Today's Matches

on:
  workflow_dispatch:

jobs:
  check-today:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check today's FotMob matches
        run: python check_today.py
